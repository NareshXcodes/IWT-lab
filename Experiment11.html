<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment-11</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        .headings {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .spans {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .styledCard {
            background: linear-gradient(rgb(247, 234, 207), white);
            height: 400px;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
            font-family: Arial, Helvetica, sans-serif;
        }
        .loginForm {
            display: flex;
            justify-content: start;
            align-items: center;
            flex-direction: column;
            gap: 15px;
            background-color: white;
            box-shadow: 4px 4px 4px 4px rgba(0, 0, 0, 0.418);
            width: 40%;
            height: 90%;
            border: none;
            border-radius: 5px;
        }
        .userInput {
            width: 90%;
            height: 35px;
            border: 1px solid lightgray;
            border-radius: 5px;
            padding: 5px;
        }
        .loginForm span {
            font-size: 20px;
        }
        .loginForm button {
            width: 90%;
            height: 40px;
            background-color: #4CAF50;
            ;
            color: white;
            font-size: 20px;
            border: none;
            border-radius: 5px;
        }
        .productSection {
            width: 100%;
            min-height: 800px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            background: linear-gradient(#736ced, #9f9fed, #d4c1ec);
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            height: 90%;
            display: flex;
            flex-direction: column;
            justify-content: start;
            align-items: center;
        }
        .ProductCards {
            width: 100%;
            height: auto;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: space-evenly;
            align-items: center;
            gap: 20px;
        }
        .cards {
            width: 250px;
            height: 400px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #f2dfd7;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .productPic {
            object-fit: cover;
            object-position: center;
            height: 60%;
            width: 100%;
            border-radius: 5px;
        }
        .cards button {
            background-color: #4CAF50;
            color: white;
            font-size: 10px;
            border: none;
            border-radius: 5px;
            height: 30px;
            width: 100px;
        }
    </style>
</head>
<body>
    <div class="headings">
        <h1>HTML</h1>
        <h2>CSS</h2>
        <h3>JavaScript</h3>
    </div>

    <span class="spans">JSP</span>
    <span class="spans">JDBC</span>
    <span class="spans">MySQL</span>

    <div class="styledCard">
        <div class="loginForm">
            <h1 class="HeadingsOfForm">Login</h1>
            <input class="userInput" type="text" placeholder="Username" />
            <input class="userInput" type="password" placeholder="Password" />
            <span><input type="checkbox">Remember Me</span>
            <button>Login</button>
        </div>
    </div>

    <section class="productSection">
        <div class="container">
            <h1>Featured Products</h1>
            <div class="ProductCards">
                <div class="cards">
                    <img class="productPic" src="https://m.media-amazon.com/images/I/4188-HFRxSL._SY450_.jpg">
                    <h1>SNITCH PERFUME</h1>
                    <p>Price: $150</p>
                    <button>🛒ADD TO CART</button>
                </div>
                <div class="cards">
                    <img class="productPic"
                        src="https://encrypted-tbn0.gstatic.com/shopping?q=tbn:ANd9GcTw8swC_ahqzQ2lKIPDFKtjbpi3zZ4-TimxQCcneF_9jtr5-uv_WJJ9T_aplBxzZ_5albZvug0dMJfXbhnff7NSEL0VQllfjRcSPag2-tDXTIgmlLZujMHcfAvjPH1RRpueCRmsSNc&usqp=CAc">
                    <h2>CREED ROYAL OUD</h2>
                    <p>Price: $40</p>
                    <button>🛒ADD TO CART</button>
                </div>
                <div class="cards">
                    <img class="productPic"
                        src="https://encrypted-tbn2.gstatic.com/shopping?q=tbn:ANd9GcT8vSOk5WBrcqv6pc5EFrzOmZPCt_U0iEdacpcShe8kUymNQlWPUiFJuQO2b_vu8LtEk-OqdzsXkuYcX6--9yi_CSfGYHrUlWyuGg0jpUfMN2EEIIzYZL_bNUrqiMSwDYge2B5M3fs&usqp=CAc">
                    <h1>EMBAROUGH</h1>
                    <p>Price: $50</p>
                    <button>🛒ADD TO CART</button>
                </div>
                <div class="cards">
                    <img class="productPic"
                        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSIE1T5azPTZ3mLGgTBtgZp1hNI64Sg7e8wfg&s">
                    <h1>YAAN KIT</h1>
                    <p>Price: $200</p>
                    <button>🛒ADD TO CART</button>
                </div>
            </div>
        </div>
    </section>
    
</body>

</html>
